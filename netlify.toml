# Netlify settings. These override the Netlify UI, so a wrong publish directory
# or Node version set there can't break the deploy.
[build]
  command = "npm run build"
  # Netlify's Next.js runtime reads .next and publishes the static export from out/.
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"

[functions]
  directory = "netlify/functions"

# Netlify's Next.js runtime (pinned in package.json).
[[plugins]]
  package = "@netlify/plugin-nextjs"

[[headers]]
  for = "/*"
  [headers.values]
    # Baseline policy. Each page also carries a stricter script policy (hash-based) in a <meta> tag.
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-src https://challenges.cloudflare.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(self), geolocation=(), payment=()"
    Cross-Origin-Opener-Policy = "same-origin"
